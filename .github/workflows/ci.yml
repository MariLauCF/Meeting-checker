name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  validate-monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/k8s/prometheus:/p" prom/prometheus:v2.55.1 check rules /p/alert-rules.yml
      - name: Validate Alertmanager config
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/k8s/alertmanager:/a" prom/alertmanager:v0.27.0 check-config /a/alertmanager.yml
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s/ > /dev/null

  docker:
    needs: [test, validate-monitoring]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: app
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/meeting-checker:latest
