# PLACEHOLDER secret. Replace the webhook with your own Slack Incoming Webhook URL:
#   kubectl -n meeting-checker create secret generic alertmanager-secrets \
#     --from-literal=slack-webhook-url='https://hooks.slack.com/services/XXX/YYY/ZZZ' \
#     --from-literal=smtp-password='unused' --dry-run=client -o yaml | kubectl apply -f -
# NEVER commit a real webhook URL to Git.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
type: Opaque
stringData:
  slack-webhook-url: "https://hooks.slack.com/services/REPLACE/ME/PLEASE"
  smtp-password: "unused"
